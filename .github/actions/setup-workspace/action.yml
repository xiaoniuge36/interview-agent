name: Setup workspace
description: 安装 pnpm、Node.js 并安装锁定依赖（可选安装 uv/Python 与 Agent Runtime 依赖），依赖缓存共享 pnpm store。

inputs:
  python:
    description: 是否安装 uv/Python 并同步 agent-runtime 依赖
    required: false
    default: 'false'
  node-version:
    description: Node.js 版本（CI 基准）
    required: false
    default: '22'
  pnpm-version:
    description: pnpm 版本
    required: false
    default: '10.33.0'
  python-version:
    description: Python 版本（CI 基准）
    required: false
    default: '3.12'
  uv-version:
    description: uv 版本
    required: false
    default: '0.11.6'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Install Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install uv and Python
      if: ${{ inputs.python == 'true' }}
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: apps/agent-runtime/uv.lock

    - name: Install Node.js dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Python dependencies
      if: ${{ inputs.python == 'true' }}
      shell: bash
      run: uv sync --project apps/agent-runtime --frozen --extra dev
