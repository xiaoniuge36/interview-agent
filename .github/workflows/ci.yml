name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          python: 'true'

      - name: Check generated contracts
        run: pnpm contracts:check

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Check formatting
        run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          python: 'true'

      - name: Restore Turbo cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .turbo/cache
          key: turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          python: 'true'

      - name: Restore Turbo cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Typecheck
        run: pnpm typecheck

  unit-test:
    name: Unit tests and evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/interview_agent?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_REQUIRED: 'false'
      API_HOST: 127.0.0.1
      API_PORT: '7101'
      API_BODY_LIMIT: 1mb
      API_CORS_ORIGINS: http://localhost:7100,http://localhost:7102
      API_SWAGGER_ENABLED: 'false'
      AUTH_MODE: development
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      JWT_ISSUER: interview-agent-ci
      JWT_AUDIENCE: interview-agent-web
      AGENT_RUNTIME_URL: http://127.0.0.1:7103
      AGENT_RUNTIME_FALLBACK_ENABLED: 'true'
      INTERNAL_AGENT_TOKEN: ci-internal-agent-token-change-me
      CREDENTIAL_ENCRYPTION_KEY_CURRENT: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CREDENTIAL_ENCRYPTION_KEY_VERSION: '1'
      AI_CIRCUIT_FAILURE_THRESHOLD: '3'
      AI_CIRCUIT_COOLDOWN_MS: '30000'
      AI_CIRCUIT_HALF_OPEN_MAX_PROBES: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          python: 'true'

      - name: Restore Turbo cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .turbo/cache
          key: turbo-unit-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-unit-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Test
        run: pnpm test

      - name: Run deterministic agent evals
        run: pnpm test:evals

      - name: Run retrieval golden evals
        run: pnpm test:retrieval-eval

      # 失败时也上传：goldenScore/fallbackRate 需要跨 PR 对比与回归定位
      - name: Upload eval artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-eval-results
          path: test-results/evals/
          if-no-files-found: ignore

  integration-test:
    name: Migration and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_DB: interview_agent
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d interview_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/interview_agent?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_REQUIRED: 'true'
      RUN_DATABASE_INTEGRATION: 'true'
      API_HOST: 127.0.0.1
      API_PORT: '7101'
      API_BODY_LIMIT: 1mb
      API_CORS_ORIGINS: http://localhost:7100,http://localhost:7102
      API_SWAGGER_ENABLED: 'false'
      AUTH_MODE: development
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      JWT_ISSUER: interview-agent-ci
      JWT_AUDIENCE: interview-agent-web
      AGENT_RUNTIME_URL: http://127.0.0.1:7103
      AGENT_RUNTIME_FALLBACK_ENABLED: 'true'
      INTERNAL_AGENT_TOKEN: ci-internal-agent-token-change-me
      CREDENTIAL_ENCRYPTION_KEY_CURRENT: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CREDENTIAL_ENCRYPTION_KEY_VERSION: '1'
      AI_CIRCUIT_FAILURE_THRESHOLD: '3'
      AI_CIRCUIT_COOLDOWN_MS: '30000'
      AI_CIRCUIT_HALF_OPEN_MAX_PROBES: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Run database integration tests
        run: pnpm --filter @interview-agent/product-api test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:7101/api
      NEXT_PUBLIC_APP_NAME: Interview Agent
      NEXT_PUBLIC_AUTH_MODE: development
      NEXT_PUBLIC_OIDC_AUTHORITY: https://identity.example.com/
      NEXT_PUBLIC_OIDC_CLIENT_ID: interview-agent-web
      NEXT_PUBLIC_OIDC_REDIRECT_URI: http://localhost:7100/auth/callback
      NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:7100
      NEXT_PUBLIC_ADMIN_OIDC_CLIENT_ID: interview-agent-admin
      NEXT_PUBLIC_ADMIN_OIDC_REDIRECT_URI: http://localhost:7102/auth/callback
      NEXT_PUBLIC_ADMIN_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:7102
      NEXT_PUBLIC_OIDC_SCOPE: openid profile email
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          python: 'true'

      - name: Restore Turbo cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          python: 'true'

      - name: Audit Node and Python dependencies
        run: pnpm security:audit

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - static-checks
      - lint
      - typecheck
      - unit-test
      - integration-test
      - build
      - audit
      # 密钥泄漏与其他质量问题同级：进入聚合门禁，泄漏时 quality 变红并阻断 e2e/docker-build
      - secret-scan
    if: ${{ always() }}
    steps:
      - name: Fail when any required job did not succeed
        if: >-
          ${{
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled') ||
            contains(needs.*.result, 'skipped')
          }}
        run: exit 1

      - name: Confirm quality gates
        run: echo "All quality gate jobs succeeded."

  e2e:
    name: E2E acceptance
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/interview_agent?schema=public
      REDIS_REQUIRED: 'true'
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          python: 'true'

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E acceptance
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-e2e-diagnostics
          path: |
            playwright-report/
            test-results/e2e/
          if-no-files-found: ignore

  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f infra/docker/docker-compose.yml config --quiet

  docker-build:
    name: Build ${{ matrix.name }} image
    needs:
      - quality
      - compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/product-api/Dockerfile
            target: runtime
          - name: migration
            dockerfile: apps/product-api/Dockerfile
            target: migration
          - name: web
            dockerfile: apps/user-portal/Dockerfile
            target: runtime
          - name: admin
            dockerfile: apps/admin-console/Dockerfile
            target: runtime
          - name: agent-runtime
            dockerfile: apps/agent-runtime/Dockerfile
            target: runtime
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          tags: interview-agent/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          show-openssf-scorecard: true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: interview-agent-sbom.spdx.json
          upload-artifact: true

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: /language:${{ matrix.language }}
